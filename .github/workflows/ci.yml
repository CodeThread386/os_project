name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System tools (sandbox, tracing)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap strace
      - name: Allow unprivileged user namespaces for bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install
        run: pip install -e '.[dev]' pyflakes
      - name: Lint
        run: python -m pyflakes agentlayer tests
      - name: Tests
        run: python -m pytest
