[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlayer"
version = "2.0.0"
description = "Agentic AI control layer for Linux: an LLM plans OS actions, a capability broker authorises them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sarthak Trivedi" },
    { name = "Mrinal Gupta" },
    { name = "Vaaman Bansal" },
]
dependencies = [
    "groq>=0.30",
    "httpx>=0.27",
    "jeepney>=0.8",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentlayer = "agentlayer.cli:main"

[tool.setuptools.packages.find]
include = ["agentlayer*"]

[tool.setuptools.package-data]
agentlayer = ["policies/*.toml", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
