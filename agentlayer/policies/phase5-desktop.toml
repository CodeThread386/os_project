# Phase 5 - desktop assistant (default).
# Everything in phase 4, plus the abilities added after Review 1: your home
# folders, desktop applications and windows, internet access for commands,
# installing software through sudo, and long-term memory. Every new power
# that could do harm sits behind a confirmation, and anything that runs as
# root needs your approval each time, whatever this file says.

[policy]
name = "phase5-desktop"
description = "Phase 5: phase 4 plus home folders, desktop apps, internet for commands, software installs and memory"

[workspace]
root = "~/agentlayer-workspace"

[agent]
max_steps = 20
max_tool_output = 6000

[audit]
path = "~/.local/state/agentlayer/audit.jsonl"

[deny]
paths = [
    # Hidden files and folders in your home directory hold settings, browser
    # profiles, keyrings and credentials: never readable, never writable.
    "~/.*", "~/.*/**",
    "**/.env", "**/.env.*", "**/*.pem", "**/*.key", "**/id_rsa*", "**/id_ed25519*", "**/.netrc",
    "**/.git-credentials", "**/*.kdbx", "**/.npmrc", "**/.pypirc",
    "/etc/shadow", "/etc/gshadow", "/etc/sudoers", "/etc/sudoers.d/**",
]

[[grant]]
right = "fs.read"
paths = [
    "{workspace}/**",
    "~/**",
    "/proc/**",
    "/etc/os-release", "/etc/hostname", "/etc/hosts", "/etc/passwd", "/etc/group",
    "/usr/share/doc/**", "/usr/include/**",
]

[[grant]]
right = "fs.write"
paths = [
    "{workspace}/**",
    "~/Documents/**", "~/Downloads/**", "~/Desktop/**", "~/Pictures/**", "~/Music/**", "~/Videos/**",
]
confirm_overwrite = true

[[grant]]
right = "fs.delete"
paths = [
    "{workspace}/**",
    "~/Documents/**", "~/Downloads/**", "~/Desktop/**", "~/Pictures/**", "~/Music/**", "~/Videos/**",
]
confirm = true

[[grant]]
right = "exec"
sandbox = "auto"
network = "confirm"        # a command may ask for internet access; you approve it
extra_dirs = ["~/Documents", "~/Downloads", "~/Desktop", "~/Pictures", "~/Music", "~/Videos"]
timeout = 60
max_timeout = 600
programs = [
    "ls", "cat", "head", "tail", "wc", "grep", "find", "sort", "uniq", "cut", "tr", "nl", "tac", "rev",
    "echo", "printf", "date", "cal", "pwd", "stat", "file", "du", "diff", "cmp", "comm",
    "md5sum", "sha1sum", "sha256sum", "base64", "basename", "dirname", "realpath", "tree", "column",
    "seq", "sleep", "true", "false", "yes", "expr", "factor", "bc", "jq", "xargs",
    "uptime", "free", "uname", "whoami", "id", "nproc", "lscpu", "getconf",
    "python3", "bash", "sh", "awk", "sed", "gcc", "cc", "g++", "make", "git", "tar", "gzip", "gunzip", "zip", "unzip",
    "curl", "wget", "pip", "pip3", "npm", "node", "npx", "ping", "dig", "host", "nslookup",
]
sandboxed_only = ["python3", "bash", "sh", "awk", "sed", "xargs", "gcc", "cc", "g++", "make", "git", "tar", "zip", "unzip",
                  "curl", "wget", "pip", "pip3", "npm", "node", "npx"]
workspace_programs = true
confirm_programs = []
[grant.deny_args]
find = ["-delete", "-exec*", "-ok*", "-fprint*", "-fls"]
git = ["push", "clean", "filter-branch"]
[grant.limits]
cpu_seconds = 120
memory_mb = 4096
file_size_mb = 512
open_files = 512

[[grant]]
right = "net.read"
hosts = [
    "*.wikipedia.org", "*.wikimedia.org", "docs.python.org", "man7.org", "*.kernel.org",
    "api.github.com", "raw.githubusercontent.com", "github.com", "pypi.org", "wttr.in",
    "httpbin.org", "example.com", "*.stackexchange.com", "stackoverflow.com",
]
confirm_unlisted = true
allow_private = false

[[grant]]
right = "proc.read"
scope = "all"

[[grant]]
right = "proc.signal"
scope = "own"
confirm = true
signals = ["SIGTERM", "SIGINT", "SIGHUP", "SIGKILL", "SIGSTOP", "SIGCONT", "SIGUSR1", "SIGUSR2"]
protect = [
    "systemd", "init", "sshd", "dbus-daemon", "dbus-broker", "Xorg", "Xwayland", "gnome-shell", "gnome-session*",
    "plasmashell", "kwin_*", "ksmserver", "sddm*", "gdm*", "pipewire*", "wireplumber", "pulseaudio",
    "NetworkManager", "polkitd", "login", "agetty", "tmux*", "screen", "ollama",
]

[[grant]]
right = "proc.priority"
scope = "own"
protect = ["systemd", "Xorg", "Xwayland", "gnome-shell", "plasmashell", "kwin_*", "pipewire*"]

[[grant]]
right = "gui.launch"
# Apps launched without asking; any other installed app needs your confirmation.
apps = [
    "firefox", "brave-browser", "com.brave.browser", "google-chrome", "chromium*", "code", "org.kde.*",
    "libreoffice-*", "org.gnome.calculator", "vlc", "org.videolan.vlc", "gimp", "org.gimp.gimp",
]
confirm_unlisted = true

[[grant]]
right = "gui.windows"
confirm_close = true       # closing may lose unsaved work

[[grant]]
right = "gui.screen"
confirm = true             # the screen may show private things

[[grant]]
right = "gui.clipboard"
confirm_read = true        # the clipboard often holds passwords

[[grant]]
right = "sys.admin"
# Always confirmed (a broker invariant), and the sudo password never reaches the model.
programs = ["apt", "apt-get", "apt-cache", "dpkg", "snap", "flatpak", "systemctl", "service",
            "journalctl", "dmesg", "ufw", "lsof", "ss"]
managers = ["apt", "snap", "flatpak", "pipx"]
timeout = 900
[grant.deny_args]
systemctl = ["poweroff", "reboot", "halt", "kexec", "suspend", "hibernate", "isolate", "emergency", "rescue"]

[[grant]]
right = "memory"
max_items = 200

[[grant]]
right = "sys.read"

[[grant]]
right = "sys.logs"          # read systemd journal logs (the user is in the adm group)

[[grant]]
right = "task.schedule"     # unattended tasks on systemd user timers; creating one always asks you
max_tasks = 20

[[grant]]
right = "cap.request"       # the agent may ask you for a temporary, expiring capability
max_minutes = 120
